# ARTI (RTL-to-QEMU integration) profile for the RISC-V SIMT GPU.
#
# ARTI parses the emitted SystemVerilog top (GpuHostSystemAxi), drives its AXI4
# control slave, and services its AXI4 memory master from guest physical RAM.
# `scripts/run_arti_gpu.sh` selects the embedded RTL backend with GPU_SIM=
# flashsim (default) or verilator.
# Debian display profile: modest native mode for interactive simulation.
#
# A hardware SoC attaches the same standard master port to its L2/DRAM fabric.
project:
  name: riscv_simt_opengpu_linux
  qemu_flavor: upstream
  qemu_machine: virt

rtl:
  top_module: GpuHostSystemAxi
  # Emitted by the Chisel flow:
  #   sbt "runMain opengpu.elaboration.EmitGpuHostSystemAxi"
  source_files: [../generated/debian-64x64/GpuHostSystemAxi.sv]
  clk_freq_mhz: 100

bridge:
  protocol: axi4
  base_address: "0x0B00_0000"
  data_width: 32
  mode: qemu-embedded
  irq_number: 180

integration:
  irq_base: 180
  dt_compat: ["riscv-simt,opengpu"]
  driver_ko: gpu_drv.ko
  driver_deps: ""
  driver_manifest: ""
  # Printed by the guest after dumb-buffer modeset and page flip both pass.
  driver_marker: "OPENGPU USERSPACE DRM PASS"
  skip_generic_test: true

advanced:
  timeout_cycles: 1000

display:
  enabled: true
  source: guest-memory
  width: 64
  height: 64
  format: a8r8g8b8
  address_register: 0x44
  stride_register: 0x48
  control_register: 0x58
  width_register: 0x4c
  height_register: 0x50
  format_register: 0x54
  refresh_hz: 30
  framebuffer_size: 0x4000  # 64 * 64 * 4 bytes
