# ARTI (RTL-to-QEMU integration) profile for the RISC-V SIMT GPU.
#
# ARTI parses the emitted SystemVerilog top (GpuHostAxi, see
# src/main/scala/opengpu/elaboration/EmitGpuHostAxi.scala), infers an AXI4 slave
# from the s_axi_* port names, and generates the embedded QEMU device model
# plus the device-tree node.  This profile keeps the integration metadata next
# to the driver so it can be copied into any project.
#
# Embedded ARTI adapts the renderer's memory clients to QEMU guest RAM. A
# hardware SoC attaches the same ports to its coherent off-chip L2/DRAM.
project:
  name: riscv_simt_opengpu_linux
  qemu_flavor: upstream
  qemu_machine: virt

rtl:
  top_module: GpuHostAxi
  # Emitted by the Chisel flow:
  #   sbt "runMain opengpu.elaboration.EmitGpuHostAxi"
  source_files: [../generated/host/GpuHostAxi.sv]
  clk_freq_mhz: 100

bridge:
  protocol: axi4
  base_address: "0x0B00_0000"
  data_width: 32
  mode: qemu-embedded
  irq_number: 180

integration:
  irq_base: 180
  dt_compat: ["riscv-simt,opengpu"]
  driver_ko: gpu_drv.ko
  driver_deps: ""
  driver_manifest: ""
  # Printed only after the render self-test and DRM device registration pass.
  driver_marker: "OPENGPU DRM PASS"
  skip_generic_test: true

advanced:
  timeout_cycles: 1000

display:
  enabled: true
  source: guest-memory
  width: 16
  height: 16
  format: a8r8g8b8
  address_register: 0x44
  stride_register: 0x48
  framebuffer_size: 0x400
