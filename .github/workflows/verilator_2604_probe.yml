# TEMPORARY probe workflow: validates whether Ubuntu 26.04's apt Verilator
# (5.032) can replace the from-source v5.050 build in scala_test.yml.
# Delete this file once the decision is made.
name: Verilator 26.04 probe

on:
  # Push-triggered runs execute a fast representative subset; use
  # workflow_dispatch with "ALL" for the full 119-suite sweep.
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test_globs:
        description: 'Space-separated testOnly globs, or "ALL" for the full suite'
        required: false
        default: 'ALL'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04

    env:
      JAVA_OPTS: -Xms6G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms6G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Install Verilator from apt
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator
        verilator --version
        curl -sL https://github.com/chipsalliance/espresso/releases/download/v2.4/x86_64-linux-gnu-espresso -o /usr/local/bin/espresso
        chmod +x /usr/local/bin/espresso
    - name: Run tests
      run: |
        GLOBS="${{ github.event.inputs.test_globs }}"
        if [ -z "$GLOBS" ]; then
          # Push-triggered: representative subset spanning the FMA/Fp/vector
          # datapaths, the memory/MMU path and the graphics + system AXI tops.
          GLOBS="opengpu.util.* opengpu.core.execute.fpu.* opengpu.core.vector.* opengpu.core.memory.* opengpu.graphics.* opengpu.system.*"
        fi
        echo "testOnly $GLOBS"
        if [ "$GLOBS" = "ALL" ]; then
          sbt 'set Test / parallelExecution := false' test
        else
          sbt 'set Test / parallelExecution := false' "testOnly $GLOBS"
        fi
        echo "::notice::verilator=$(verilator --version)"
