name: GTK coverage guest proof

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gtk_coverage.yml'
      - 'src/main/scala/opengpu/core/**'
      - 'src/main/scala/opengpu/graphics/**'
      - 'src/main/scala/opengpu/config/**'
      - 'userspace/gallium/**'
      - 'userspace/examples/gl_gtk_coverage.c'
      - 'driver/**'
      - 'scripts/build_arti_debian_display.sh'
      - 'scripts/build_mesa_opengpu.sh'
      - 'scripts/ci_aarch64_cross.py'
      - 'scripts/ci_aarch64_gcc.sh'
      - 'scripts/ci_gtk_coverage*'
      - 'scripts/ci_prepare_gtk_hosted.sh'
      - 'scripts/run_arti_debian.sh'
      - 'scripts/run_arti_gpu.sh'

permissions:
  contents: read

# The public repository can use a free standard Ubuntu runner. Remove unused
# image toolchains first to leave room for the kernel, QEMU, Mesa, and guest.
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: gtk-coverage-hosted-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: gpu
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenGPGPU/arti
          ref: 463df439ab19bc7455cf9878f385bd48cfc89073
          path: arti
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenGPGPU/FlashSim
          ref: b93a07ff81737173ecfc181f292fec689f71bfb8
          path: FlashSim
          persist-credentials: false
      - name: Free space for guest build
        run: |
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift
          sudo apt-get clean
          df -h .
      - name: Install host and cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake meson ninja-build pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf \
            xorriso cpio bison flex libglib2.0-dev libpixman-1-dev \
            libfdt-dev zlib1g-dev libssl-dev python3-venv \
            python3-yaml python3-jinja2 python3-mako python3-ply \
            expect openssh-client
          sudo apt-get clean
          df -h .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Prepare pinned AArch64 Mesa dependencies
        working-directory: gpu
        run: bash scripts/ci_prepare_gtk_hosted.sh
      - name: Build and run the 640x480 guest proof
        working-directory: gpu
        env:
          JOBS: '3'
        run: bash scripts/ci_gtk_coverage.sh
      - name: Keep guest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gtk-coverage-guest-logs
          path: |
            arti-work/ci-gtk-coverage/*.log
          if-no-files-found: ignore
