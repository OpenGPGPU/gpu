# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  driver:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run host driver tests
      run: python3 scripts/test_driver.py
    - name: Check integration test selection
      run: python3 scripts/test_test_selection.py

  build:

    runs-on: ubuntu-latest

    env:
      JAVA_OPTS: -Xms6G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms6G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Compute Verilator cache key
      id: verilator-key
      # ImageOS is injected into the runner's process environment but is not
      # part of the expression context, so read it from the shell. Keying on the
      # image family (ubuntu24/ubuntu26) means a runner image migration rebuilds
      # rather than reusing a binary linked against a different glibc.
      run: echo "key=verilator-5.050-${ImageOS:-unknown}-${{ runner.arch }}" >> "$GITHUB_OUTPUT"
    - name: Cache Verilator
      id: verilator-cache
      uses: actions/cache@v4
      with:
        path: /opt/verilator
        key: ${{ steps.verilator-key.outputs.key }}
    - name: Install Verilator (v5.050 from source) and espresso
      run: |
        sudo apt-get update
        sudo apt-get install -y git perl python3 make autoconf g++ flex bison libfl-dev zlib1g-dev ccache help2man
        echo "/opt/verilator/bin" >> "$GITHUB_PATH"
        curl -sL https://github.com/chipsalliance/espresso/releases/download/v2.4/x86_64-linux-gnu-espresso -o /usr/local/bin/espresso
        chmod +x /usr/local/bin/espresso
        if [ "${{ steps.verilator-cache.outputs.cache-hit }}" = "true" ]; then
          /opt/verilator/bin/verilator --version
          exit 0
        fi
        sudo mkdir -p /opt/verilator
        sudo chown "$(id -u):$(id -g)" /opt/verilator
        git clone --depth 1 --branch v5.050 https://github.com/verilator/verilator /tmp/verilator
        cd /tmp/verilator
        autoconf
        ./configure --prefix=/opt/verilator
        make -j"$(nproc)"
        make install
        /opt/verilator/bin/verilator --version
    - name: Select affected tests
      id: select
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE=$(git merge-base origin/main HEAD)
        else
          BASE=$(git rev-parse HEAD^)
        fi
        CHANGED=$(git diff --name-only "$BASE" HEAD)
        echo "Changed files:"
        echo "$CHANGED"
        SELECTED=$(bash scripts/select_tests.sh $CHANGED)
        echo "Selected: $SELECTED"
        echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
    - name: Run tests
      run: |
        # Only run the packages affected by the changed files; ALL/NONE
        # fallbacks are handled here too.
        if [ "${{ steps.select.outputs.selected }}" = "ALL" ]; then
          sbt 'set Test / parallelExecution := false' test
        elif [ "${{ steps.select.outputs.selected }}" = "NONE" ]; then
          echo "No Scala sources affected; skipping tests"
        else
          sbt 'set Test / parallelExecution := false' \
            "testOnly ${{ steps.select.outputs.selected }}"
        fi
    - name: Upload dependency graph
      uses: scalacenter/sbt-dependency-submission@ab086b50c947c9774b70f39fc7f6e20ca2706c91
