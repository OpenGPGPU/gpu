name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      JAVA_OPTS: -Xms6G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8
      JVM_OPTS: -Xms6G -Xmx6G -Xss6M -XX:+UseG1GC -Dfile.encoding=UTF-8

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Install Verilator (v5.050 from source) and espresso
      run: |
        sudo apt-get update
        sudo apt-get install -y git perl python3 make autoconf g++ flex bison libfl-dev zlib1g-dev ccache help2man
        git clone --depth 1 --branch v5.050 https://github.com/verilator/verilator /tmp/verilator
        cd /tmp/verilator
        autoconf
        ./configure
        make -j"$(nproc)"
        sudo make install
        verilator --version
        curl -sL https://github.com/chipsalliance/espresso/releases/download/v2.4/x86_64-linux-gnu-espresso -o /usr/local/bin/espresso
        chmod +x /usr/local/bin/espresso
    - name: Select affected tests
      id: select
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE=$(git merge-base origin/main HEAD)
        else
          BASE=$(git rev-parse HEAD^)
        fi
        CHANGED=$(git diff --name-only "$BASE" HEAD)
        echo "Changed files:"
        echo "$CHANGED"
        SELECTED=$(bash scripts/select_tests.sh $CHANGED)
        echo "Selected: $SELECTED"
        echo "selected=$SELECTED" >> "$GITHUB_OUTPUT"
    - name: Run tests
      run: |
        # Only run the packages affected by the changed files; ALL/NONE
        # fallbacks are handled here too.
        if [ "${{ steps.select.outputs.selected }}" = "ALL" ]; then
          sbt 'set Test / parallelExecution := false' test
        elif [ "${{ steps.select.outputs.selected }}" = "NONE" ]; then
          echo "No Scala sources affected; skipping tests"
        else
          sbt 'set Test / parallelExecution := false' \
            "testOnly ${{ steps.select.outputs.selected }}"
        fi
    - name: Upload dependency graph
      uses: scalacenter/sbt-dependency-submission@ab086b50c947c9774b70f39fc7f6e20ca2706c91
